name: Material Icons Release Pipeline

on:
  workflow_dispatch:
    inputs:
      SourceRef:
        description: 'Exact verified source commit (40-character SHA)'
        type: string
        required: true
      PublishToNuget:
        description: 'Publish the validated artifact to nuget.org'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: material-icons-release
  cancel-in-progress: false

jobs:
  build_and_validate:
    runs-on: windows-latest
    outputs:
      version: ${{ steps.source.outputs.version }}
      atomui_version: ${{ steps.source.outputs.atomui_version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.SourceRef }}
      - name: Verify immutable source and versions
        id: source
        shell: pwsh
        env:
          SOURCE_REF: ${{ inputs.SourceRef }}
          NUGET_PUBLISH_CONFIGURED: ${{ secrets.NUGET_API_KEY != '' }}
          PUBLISH_REQUESTED: ${{ inputs.PublishToNuget }}
        run: |
          $ErrorActionPreference = 'Stop'
          Write-Output "NuGet publication credential available: $env:NUGET_PUBLISH_CONFIGURED"
          if ($env:PUBLISH_REQUESTED -eq 'true' -and $env:NUGET_PUBLISH_CONFIGURED -ne 'true') { throw 'NUGET_API_KEY is not configured for this repository' }
          if ($env:SOURCE_REF -notmatch '^[0-9a-fA-F]{40}$') { throw 'SourceRef must be a full commit SHA' }
          if ((git rev-parse HEAD) -ne $env:SOURCE_REF) { throw 'Checkout does not match SourceRef' }
          [xml]$versions = Get-Content build/Version.props
          $version = [string]$versions.Project.PropertyGroup.MaterialVersion
          $atomui = [string]$versions.Project.PropertyGroup.AtomUIVersion
          if ($version -ne $atomui) { throw 'Material and AtomUI versions must match' }
          "version=$version" >> $env:GITHUB_OUTPUT
          "atomui_version=$atomui" >> $env:GITHUB_OUTPUT
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.x'
      - name: Test release tooling
        run: python -m unittest discover -s scripts/release/tests -p "test_*.py" -v
      - name: Restore, build and test Release
        shell: pwsh
        run: |
          dotnet restore Material.slnx -p:Configuration=Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet build Material.slnx -c Release --no-restore -m:1 -nr:false
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet test Material.slnx -c Release --no-build --no-restore
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Pack once, validate and hash
        shell: pwsh
        env:
          VERSION: ${{ steps.source.outputs.version }}
          ATOMUI_VERSION: ${{ steps.source.outputs.atomui_version }}
          SOURCE_REF: ${{ inputs.SourceRef }}
        run: |
          $ErrorActionPreference = 'Stop'
          $packageDir = Join-Path $env:RUNNER_TEMP 'material-nuget'
          New-Item -ItemType Directory -Path $packageDir | Out-Null
          dotnet pack src/AtomUI.Icons.Material/AtomUI.Icons.Material.csproj -c Release --no-build --no-restore -o $packageDir
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/release/validate_nupkg.py $packageDir --expected-version $env:VERSION --expected-atomui-version $env:ATOMUI_VERSION --expected-commit $env:SOURCE_REF
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $package = Get-ChildItem $packageDir -Filter '*.nupkg'
          $hash = (Get-FileHash $package.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $($package.Name)" | Set-Content (Join-Path $packageDir 'SHA256SUMS') -Encoding ascii
      - uses: actions/upload-artifact@v7
        with:
          name: NuGetPackages
          path: ${{ runner.temp }}/material-nuget/*
          if-no-files-found: error

  publish:
    if: ${{ inputs.PublishToNuget }}
    needs: build_and_validate
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.SourceRef }}
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.x'
      - uses: actions/download-artifact@v7
        with:
          name: NuGetPackages
          path: ${{ runner.temp }}/material-nuget
      - name: Verify downloaded artifact and publish without rebuilding
        shell: pwsh
        env:
          VERSION: ${{ needs.build_and_validate.outputs.version }}
          ATOMUI_VERSION: ${{ needs.build_and_validate.outputs.atomui_version }}
          SOURCE_REF: ${{ inputs.SourceRef }}
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: |
          $ErrorActionPreference = 'Stop'
          $packageDir = Join-Path $env:RUNNER_TEMP 'material-nuget'
          $packages = @(Get-ChildItem $packageDir -Filter '*.nupkg')
          if ($packages.Count -ne 1) { throw 'Expected exactly one validated package' }
          $package = $packages[0]
          $checksum = (Get-Content (Join-Path $packageDir 'SHA256SUMS')).Trim()
          $hash = (Get-FileHash $package.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($checksum -ne "$hash  $($package.Name)") { throw 'Artifact checksum mismatch' }
          python scripts/release/validate_nupkg.py $packageDir --expected-version $env:VERSION --expected-atomui-version $env:ATOMUI_VERSION --expected-commit $env:SOURCE_REF
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ([string]::IsNullOrWhiteSpace($env:NUGET_API_KEY)) { throw 'NUGET_API_KEY is not configured' }
          dotnet nuget push $package.FullName --api-key $env:NUGET_API_KEY --source https://api.nuget.org/v3/index.json
          if ($LASTEXITCODE -ne 0) { throw 'NuGet push failed or was ambiguous; inspect this run before any user-authorized retry' }
          Write-Output "NuGet upload succeeded for AtomUI.Icons.Material $env:VERSION (artifact SHA256 $hash); GitHub Actions publication is complete."
